<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DR Sheet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; padding: 40px 60px; }
        section { background: white; border-radius: 16px; padding: 40px; border: 1px solid #e2e8f0; }
        h1 { font-weight: 700; color: #1e293b; margin-bottom: 1.5rem; font-size: 2rem;}
        .screenshot-container { margin: 25px 0; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc; text-align: center; }
        img.zoomable { width: 100%; height: auto; cursor: zoom-in; }
    </style>
</head>
<body>
    <section>
        <h1>DR Sheet Report</h1>
        <div class="screenshot-container"><img src="../src/images/Screenshot 2026-01-05 161205.png" class="zoomable"></div>
        <p><strong>In this section, users can download the DR Sheet by selecting the DR Sheet download option.</strong></p>
        <div class="screenshot-container"><img src="../src/images/Screenshot 2026-01-05 161232.png" class="zoomable"></div>
        <p><strong>To download the DR Sheet, users must fill in all the required details accurately before proceeding.</strong></p>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/medium-zoom@1.0.8/dist/medium-zoom.min.js"></script>
    <script>mediumZoom('.zoomable', { margin: 24, background: '#fff' });</script>
</body>
</html>
